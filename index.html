<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Calorie Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Calorie Tracker</h1>
      <p id="todayLabel"></p>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>

  <main>
    <section class="summary-card">
      <div class="summary-main">
        <span class="label">Calories left</span>
        <strong id="caloriesLeft">0</strong>
        <span class="unit">kcal</span>
      </div>
      <div class="summary-row">
        <div><span>Target</span><strong id="targetCalories">0</strong></div>
        <div><span>Eaten</span><strong id="eatenCalories">0</strong></div>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <section class="tabs" aria-label="Main navigation">
      <button class="tab active" data-tab="diary">Diary</button>
      <button class="tab" data-tab="foods">Foods</button>
      <button class="tab" data-tab="recipes">Recipes</button>
    </section>

    <section id="diary" class="tab-panel active">
      <div class="section-heading">
        <h2>Today</h2>
        <button id="addDiaryBtn" class="primary-btn">+ Add food</button>
      </div>
      <div id="diaryList" class="card-list"></div>
    </section>

    <section id="foods" class="tab-panel">
      <div class="section-heading">
        <h2>My foods</h2>
        <button id="addFoodBtn" class="primary-btn">+ New food</button>
      </div>
      <input id="foodSearch" class="search" type="search" placeholder="Search foods">
      <div id="foodList" class="card-list"></div>
    </section>

    <section id="recipes" class="tab-panel">
      <div class="section-heading">
        <h2>My recipes</h2>
        <button id="addRecipeBtn" class="primary-btn">+ New recipe</button>
      </div>
      <div id="recipeList" class="card-list"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>Daily target</h2>
      <label>Calories per day
        <input id="targetInput" type="number" min="1" step="1" required>
      </label>
      <menu>
        <button value="cancel" class="secondary-btn">Cancel</button>
        <button value="save" class="primary-btn" id="saveSettingsBtn">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="foodDialog">
    <form method="dialog" id="foodForm">
      <h2 id="foodDialogTitle">New food</h2>
      <input id="foodId" type="hidden">
      <label>Name
        <input id="foodName" type="text" required>
      </label>
      <label>Calories per serving
        <input id="foodCalories" type="number" min="0" step="1" required>
      </label>
      <label>Serving description
        <input id="foodServing" type="text" placeholder="e.g. 1 slice, 100 g, 1 pot">
      </label>
      <menu>
        <button value="cancel" class="secondary-btn">Cancel</button>
        <button value="save" class="primary-btn">Save food</button>
      </menu>
    </form>
  </dialog>

  <dialog id="recipeDialog">
    <form method="dialog" id="recipeForm">
      <h2 id="recipeDialogTitle">New recipe</h2>
      <input id="recipeId" type="hidden">
      <label>Recipe name
        <input id="recipeName" type="text" required>
      </label>
      <label>Total calories
        <input id="recipeCalories" type="number" min="0" step="1" required>
      </label>
      <label>Number of servings
        <input id="recipeServings" type="number" min="0.1" step="0.1" value="1" required>
      </label>
      <p class="hint">Calories per serving: <strong id="recipePerServing">0</strong> kcal</p>
      <menu>
        <button value="cancel" class="secondary-btn">Cancel</button>
        <button value="save" class="primary-btn">Save recipe</button>
      </menu>
    </form>
  </dialog>

  <dialog id="addDiaryDialog">
    <form method="dialog" id="addDiaryForm">
      <h2>Add to today</h2>
      <label>Item
        <select id="diaryItemSelect" required></select>
      </label>
      <label>Servings
        <input id="diaryServings" type="number" min="0.1" step="0.1" value="1" required>
      </label>
      <p class="hint">This will add <strong id="diaryCalculatedCalories">0</strong> kcal.</p>
      <menu>
        <button value="cancel" class="secondary-btn">Cancel</button>
        <button value="add" class="primary-btn">Add</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
